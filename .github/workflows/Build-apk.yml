name: Build Nihongo Talk AI APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      if [ ! -d app ]; then
        mkdir -p /tmp/project
        unzip -q NihongoTalkAI_Android_CloudBuild.zip -d /tmp/project
        SETTINGS=$(find /tmp/project -type f -name settings.gradle -o -name settings.gradle.kts -print -quit)
        if [ -z "$SETTINGS" ]; then
          echo "Project settings not found"
          exit 1
        fi
        cp -a "$(dirname "$SETTINGS")"/. .
      fi

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Align Java JVM target
    run: |
      cat > /tmp/jvm.init.gradle <<'EOF'
      allprojects {
        tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
          sourceCompatibility = '17'
          targetCompatibility = '17'
        }
      }
      EOF

  - name: Build APK
    run: gradle -I /tmp/jvm.init.gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NihongoTalkAI-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
