name: Build Nihongo Talk AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project if needed
        shell: bash
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP_FILE="NihongoTalkAI_Android_CloudBuild.zip"
            if [ ! -f "$ZIP_FILE" ]; then
              ZIP_FILE="NihongoTalkAI_Android_CloudBuild (1).zip"
            fi
            if [ ! -f "$ZIP_FILE" ]; then
              echo "Android project ZIP was not found in the repository root."
              exit 1
            fi
            mkdir -p /tmp/nihongo-project
            unzip -q "$ZIP_FILE" -d /tmp/nihongo-project
            SETTINGS_FILE="$(find /tmp/nihongo-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "settings.gradle or settings.gradle.kts was not found inside the ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            cp -a "$PROJECT_DIR"/. .
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NihongoTalkAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
